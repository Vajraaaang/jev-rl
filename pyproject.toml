[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-recovery"
version = "0.2.0"
description = "Recovery Lab: observable agents, local reinforcement learning, and paired incident-recovery research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jev-recovery = "jev_recovery.cli:main"

[tool.setuptools.packages.find]
include = ["jev_recovery*"]

[tool.setuptools.package-data]
jev_recovery = ["web/*.html", "web/*.css", "web/*.js"]
